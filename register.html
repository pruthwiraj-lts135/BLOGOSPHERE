<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Register | Blogosphere</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- NAVBAR -->

    <header class="navbar">
        <div class="nav-container">

            <a href="index.html" class="logo">
                <span class="logo-icon">B</span>
                <span class="logo-text">Blogosphere</span>
            </a>

            <nav class="nav-links">
                <a href="index.html">Home</a>
                <a href="explore.html">Explore</a>
                <a href="login.html">Login</a>
                <a href="register.html" class="register-btn active">
                    Register
                </a>
            </nav>

            <div class="nav-actions">
                <button id="theme-toggle" class="theme-toggle">☀</button>
                <button class="menu-toggle" id="menu-toggle">☰</button>
            </div>

        </div>
    </header>


    <!-- REGISTER -->

    <main class="auth-page">

        <div class="auth-card">

            <div class="auth-header">

                <div class="auth-icon">B</div>

                <h1>Join Blogosphere</h1>

                <p>
                    Create your account and start sharing your ideas.
                </p>

            </div>


            <form id="register-form">

                <!-- Full Name -->

                <div class="form-group">
                    <label for="full-name">
                        Full Name
                    </label>

                    <input
                        type="text"
                        id="full-name"
                        placeholder="Enter your full name"
                        required
                    >
                </div>


                <!-- Username -->

                <div class="form-group">
                    <label for="username">
                        Username
                    </label>

                    <input
                        type="text"
                        id="username"
                        placeholder="Choose a username"
                        required
                    >
                </div>


                <!-- Email -->

                <div class="form-group">
                    <label for="email">
                        Email
                    </label>

                    <input
                        type="email"
                        id="email"
                        placeholder="Enter your email"
                        required
                    >
                </div>


                <!-- Password -->

                <div class="form-group">
                    <label for="register-password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="register-password"
                        placeholder="Create a password"
                        required
                    >
                </div>


                <!-- Confirm Password -->

                <div class="form-group">
                    <label for="confirm-password">
                        Confirm Password
                    </label>

                    <input
                        type="password"
                        id="confirm-password"
                        placeholder="Confirm your password"
                        required
                    >
                </div>


                <button type="submit" class="auth-btn">
                    Create Account
                </button>

            </form>


            <p class="auth-switch">
                Already have an account?
                <a href="login.html">Login here</a>
            </p>

        </div>

    </main>


    <script src="script.js"></script>

</body>
</html>
